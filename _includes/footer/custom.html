<!-- Highlight the header link of the section currently in view (home page) -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.masthead__menu-item a[href*="#"]'));
  var sections = links.map(function (a) { return document.getElementById(a.hash.slice(1)); }).filter(Boolean);
  if (!sections.length) return;
  function update() {
    var y = window.scrollY + 120, current = null;
    sections.forEach(function (s) { if (s.offsetTop <= y) current = s.id; });
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) current = sections[sections.length - 1].id;
    links.forEach(function (a) { a.parentElement.classList.toggle("selected", a.hash === "#" + current); });
  }
  window.addEventListener("scroll", update, { passive: true });
  update();
});
</script>

<!-- Assemble obfuscated e-mail links (see _includes/home-contact.html) -->
<script>
document.querySelectorAll("a.js-email").forEach(function (a) {
  var rev = function (s) { return s.split("").reverse().join(""); };
  var address = rev(a.dataset.u) + "@" + rev(a.dataset.d);
  a.href = "mailto:" + address;
  a.textContent = address;
});
</script>

<!-- Light/dark button: accessible state + no flicker while the theme changes -->
<script>
(function () {
  var sw = document.getElementById("theme-toggle");
  if (!sw) return;
  var root = document.documentElement, timer;
  var sync = function () {
    sw.setAttribute("aria-pressed", root.getAttribute("data-theme") === "dark" ? "true" : "false");
  };
  sync();
  // Runs before the next paint: switch all colors at once (see .theme-switching in main.scss)
  new MutationObserver(function () {
    sync();
    root.classList.add("theme-switching");
    clearTimeout(timer);
    timer = setTimeout(function () { root.classList.remove("theme-switching"); }, 450);
  }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
